name: RIFE Model Validation

on:
  workflow_dispatch:

jobs:
  validate-rife:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch coremltools numpy pillow

      - name: Verify conversion tooling
        run: |
          python - <<'PY'
          import torch, coremltools, numpy
          print('PyTorch:', torch.__version__)
          print('Core ML Tools:', coremltools.__version__)
          print('NumPy:', numpy.__version__)
          PY

      - name: Verify upstream RIFE reference
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://raw.githubusercontent.com/hzwer/Practical-RIFE/main/README.md'
          with urllib.request.urlopen(url, timeout=30) as r:
              data = r.read()
          assert b'4.25' in data, 'Upstream RIFE 4.25 reference not found'
          print('Upstream RIFE 4.25 reference verified.')
          PY

      - name: Validate model artifact contract
        run: |
          test ! -e FrameBoost/RIFE_4_25.mlmodelc || true
          if [ -e FrameBoost/RIFE_4_25.mlmodelc ]; then
            echo 'Found RIFE_4_25.mlmodelc in the repository.'
            exit 0
          fi
          echo 'RIFE checkpoint/Core ML model is not yet present.'
          echo 'This validation workflow intentionally succeeds without fabricating model weights.'
          echo 'Add a legally redistributable, SHA-256-pinned checkpoint and conversion script to enable inference.'
