name: FrameBoost iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: frameboost-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: FrameBoost
  PROJECT: FrameBoost/FrameBoost.xcodeproj
  BUNDLE_ID: com.aboghzayel.FrameBoost
  IOS_DEPLOYMENT_TARGET: '26.0'
  RIFE_MODEL: FrameBoost/RIFE_4_25.mlpackage

jobs:
  ios-build:
    name: Build clean unsigned IPA with RIFE
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 and discover SDK
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app/Contents/Developer ]; then sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer; fi
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "IPHONEOS_SDK=iphoneos${SDK_VERSION}" >> "$GITHUB_ENV"
          case "$SDK_VERSION" in 26.*) ;; *) echo "Expected iOS 26 SDK, found ${SDK_VERSION}"; exit 1 ;; esac

      - name: Install Python 3.12 and RIFE dependencies
        run: |
          set -euo pipefail
          brew list --versions python@3.12 >/dev/null 2>&1 || brew install python@3.12
          PYTHON_BIN="$(brew --prefix python@3.12)/bin/python3.12"
          "$PYTHON_BIN" -m venv "$RUNNER_TEMP/rife-venv"
          source "$RUNNER_TEMP/rife-venv/bin/activate"
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "coremltools==9.0" "torch==2.7.1" "safetensors==0.5.3" "numpy<2"
          python -c "import coremltools, torch; print('coremltools', coremltools.__version__); print('torch', torch.__version__)"

      - name: Export RIFE Core ML model
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/rife-venv/bin/activate"
          test -f scripts/export_rife_coreml.py
          rm -rf "$RIFE_MODEL"
          python scripts/export_rife_coreml.py
          test -d "$RIFE_MODEL"
          test -f "$RIFE_MODEL/Manifest.json"
          python - <<'PY'
          import coremltools as ct
          p = "FrameBoost/RIFE_4_25.mlpackage"
          m = ct.models.MLModel(p)
          spec = m.get_spec()
          print("Core ML package loads successfully")
          print("specificationVersion:", spec.specificationVersion)
          print("input:", [(x.name, list(x.type.multiArrayType.shape)) for x in spec.description.input])
          print("output:", [(x.name, list(x.type.multiArrayType.shape)) for x in spec.description.output])
          assert any(x.name == "frames" for x in spec.description.input), "Missing frames input"
          assert any(x.name == "frame" for x in spec.description.output), "Missing frame output"
          inp = next(x for x in spec.description.input if x.name == "frames")
          assert list(inp.type.multiArrayType.shape) == [1, 6, 256, 256], "Unexpected RIFE input shape"
          PY

      - name: Verify Xcode RIFE resource graph
        run: |
          set -euo pipefail
          PBX="FrameBoost/FrameBoost.xcodeproj/project.pbxproj"
          test -d "$RIFE_MODEL"
          echo "RIFE project references:"
          grep -n -E 'RIFE_4_25\.mlpackage|PBXResourcesBuildPhase|A10000270000000000000001' "$PBX" || true
          grep -q 'RIFE_4_25.mlpackage' "$PBX"
          # The package must be represented by a file reference, a build file, and the target resources phase.
          grep -q 'A10000270000000000000001.*RIFE_4_25.mlpackage' "$PBX"
          grep -q 'A10000270000000000000002.*A10000270000000000000001' "$PBX"
          grep -q 'A10000100000000000000006' "$PBX"

      - name: Inspect Xcode build settings
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showBuildSettings \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES > "$RUNNER_TEMP/build-settings.txt"
          grep -E 'PRODUCT_BUNDLE_IDENTIFIER =|IPHONEOS_DEPLOYMENT_TARGET =|SDKROOT =|ARCHS =|COREML_CODEGEN_LANGUAGE =' "$RUNNER_TEMP/build-settings.txt" || true
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID" "$RUNNER_TEMP/build-settings.txt"
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = $IOS_DEPLOYMENT_TARGET" "$RUNNER_TEMP/build-settings.txt"

      - name: Clean build for iOS 26
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/FrameBoostDerived"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk "$IPHONEOS_SDK" -configuration Release -derivedDataPath "$RUNNER_TEMP/FrameBoostDerived" clean build IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Locate RIFE model in build products
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/FrameBoostDerived/Build/Products/Release-iphoneos/FrameBoost.app"
          test -d "$APP"
          echo "Searching app and DerivedData for Core ML outputs..."
          find "$RUNNER_TEMP/FrameBoostDerived" -type d \( -name '*.mlmodelc' -o -name '*.mlpackage' \) -print | sort
          echo "App bundle model directories:"
          find "$APP" -maxdepth 8 -type d \( -name '*.mlmodelc' -o -name '*.mlpackage' \) -print | sort
          RIFE_COMPILED="$APP/RIFE_4_25.mlmodelc"
          if [ ! -d "$RIFE_COMPILED" ]; then
            echo "ERROR: RIFE_4_25.mlmodelc is not at the expected app path"
            find "$RUNNER_TEMP/FrameBoostDerived" -type d -name 'RIFE_4_25.mlmodelc' -print | sort
            find "$APP" -maxdepth 3 -print | sort
            exit 1
          fi
          test -f "$RIFE_COMPILED/coremldata.bin"
          test -f "$RIFE_COMPILED/model.mil"
          test -d "$RIFE_COMPILED/weights"
          echo "RIFE compiled bundle found and structurally valid"
          find "$RIFE_COMPILED" -maxdepth 3 -type f -print | sort
          echo "RIFE_COMPILED=$RIFE_COMPILED" >> "$GITHUB_ENV"
          du -sh "$RIFE_COMPILED"

      - name: Validate app bundle
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/FrameBoostDerived/Build/Products/Release-iphoneos/FrameBoost.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/FrameBoost"
          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          ACTUAL_MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "Bundle ID: [$ACTUAL_BUNDLE_ID]"
          echo "Minimum OS: [$ACTUAL_MIN_OS]"
          test "$ACTUAL_BUNDLE_ID" = "$BUNDLE_ID"
          test "$ACTUAL_MIN_OS" = "$IOS_DEPLOYMENT_TARGET"
          /usr/bin/file "$APP/FrameBoost"
          /usr/bin/otool -hv "$APP/FrameBoost" | head -n 3
          /usr/bin/lipo -info "$APP/FrameBoost" || true
          /usr/bin/otool -hv "$APP/FrameBoost" | grep -Eq 'ARM64|arm64'
          test -f "$APP/RIFE_4_25.mlmodelc/coremldata.bin"
          echo "RIFE compiled model is embedded and validated"

      - name: Package clean IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/FrameBoostDerived/Build/Products/Release-iphoneos/FrameBoost.app"
          rm -rf Payload FrameBoost-unsigned.ipa
          mkdir -p Payload
          ditto "$APP" Payload/FrameBoost.app
          /usr/bin/zip -X -qry FrameBoost-unsigned.ipa Payload
          rm -rf Payload
          unzip -t FrameBoost-unsigned.ipa
          unzip -l FrameBoost-unsigned.ipa | grep -F 'RIFE_4_25.mlmodelc/coremldata.bin' >/dev/null
          unzip -l FrameBoost-unsigned.ipa | grep -F 'RIFE_4_25.mlmodelc/model.mil' >/dev/null

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FrameBoost-iOS26-rife-unsigned-ipa
          path: FrameBoost-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
