name: FrameBoost iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  swift-validation:
    name: Swift package validation
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Toolchain
        run: xcodebuild -version
      - name: Build core package
        run: swift build -c release
      - name: Test core package
        run: swift test -c release

  source-check:
    name: iOS source checks
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required sources
        run: |
          set -e
          test -f FrameBoost/FrameBoostApp.swift
          test -f FrameBoost/ContentView.swift
          test -f FrameBoost/VideoProcessor.swift
          test -f FrameBoost/InterpolationEngine.swift
          test -f FrameBoost/VideoPicker.swift
          test -f FrameBoost/FrameBoostModel.swift
          test -f FrameBoost/Info.plist
          echo "FrameBoost source structure OK"
